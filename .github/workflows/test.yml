name: Test Action

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run xcede action
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run xcede action
        id: xcede
        uses: ./
        with:
          version: 'latest'
          args: '--help'

      - name: Verify output
        env:
          XCEDE_RESULT: ${{ steps.xcede.outputs.result }}
        run: |
          echo "result: $XCEDE_RESULT"
          if [ -z "$XCEDE_RESULT" ]; then
            echo "::error::Expected a non-empty 'result' output"
            exit 1
          fi
