name: Run xcede
description: Automatically downloads, builds, caches, and runs the xcede CLI tool.
author: Joao Correia

branding:
  icon: terminal
  color: blue

inputs:
  version:
    description: Version of xcede to install (e.g., "latest" or "v1.2.3")
    required: false
    default: latest
  args:
    description: Additional arguments to pass to xcede
    required: false
    default: help

outputs:
  result:
    description: Output produced by xcede
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Resolve version
      id: resolve
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          VERSION=$(curl -sL https://codeberg.org/api/v1/repos/luxmentis/xcede/releases/latest | jq -r .tag_name)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo -e "\033[31m[xcede]\033[0m Failed to resolve latest version."
            exit 1
          fi
        fi
        echo -e "\033[32m[xcede]\033[0m Resolved version: $VERSION"
        echo "resolved_version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache xcede binary
      id: cache
      uses: actions/cache@v5
      with:
        path: ~/.xcede/bin
        key: xcede-${{ runner.os }}-${{ steps.resolve.outputs.resolved_version }}

    - name: Download and Build xcede
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        VERSION="${{ steps.resolve.outputs.resolved_version }}"
        mkdir -p ~/.xcede/bin
        mkdir -p /tmp/xcede-build
        cd /tmp/xcede-build

        ZIP_URL="https://codeberg.org/luxmentis/xcede/archive/${VERSION}.zip"
        curl -sL "$ZIP_URL" -o xcede.zip

        unzip -q xcede.zip
        cd xcede

        LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
        if [ -n "$LATEST_XCODE" ]; then
          echo -e "\033[34m[xcede]\033[0m Selecting newest Xcode available: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
        else
          echo -e "\033[33m[xcede]\033[0m Warning: Could not find any Xcode in /Applications"
        fi

        ACTIVE_XCODE=$(xcodebuild -version | grep Xcode | awk '{print $2}')
        if [[ "$(printf '%s\n' "26.0" "$ACTIVE_XCODE" | sort -V | head -n1)" == "$ACTIVE_XCODE" && "$ACTIVE_XCODE" != "26.0"* ]]; then
          echo "::warning::Xcode version ($ACTIVE_XCODE) is lower than 26.0. A more recent runner (minimum macos-15) must be used!"
        fi

        echo -e "\033[34m[xcede]\033[0m Building xcede..."

        ./build.sh > /tmp/xcede_build.log 2>&1 || {
          cat /tmp/xcede_build.log
          echo -e "\033[31m[xcede]\033[0m Build failed!"
          exit 1
        }

        if [ -f "xcede" ]; then
          mv xcede ~/.xcede/bin/
        else
          BINARY_PATH=$(find . -name "xcede" -type f -executable | head -n 1)
          if [ -n "$BINARY_PATH" ]; then
            mv "$BINARY_PATH" ~/.xcede/bin/
          else
            echo -e "\033[31m[xcede]\033[0m Error: Could not find compiled xcede binary."
            exit 1
          fi
        fi

        chmod +x ~/.xcede/bin/xcede
        echo -e "\033[32m[xcede]\033[0m Build complete."

    - name: Add to PATH
      shell: bash
      run: echo "$HOME/.xcede/bin" >> "$GITHUB_PATH"

    - name: Run xcede
      id: run
      shell: bash
      run: |
        echo -e "\033[34m[xcede]\033[0m xcede ${{ inputs.args }}"

        set +e
        xcede ${{ inputs.args }} | tee /tmp/xcede_out.log
        XCEDE_EXIT_CODE=${PIPESTATUS[0]}
        TEE_EXIT_CODE=${PIPESTATUS[1]}
        set -e

        if [ $TEE_EXIT_CODE -ne 0 ]; then
          echo -e "\033[33m[xcede]\033[0m tee failed with exit code $TEE_EXIT_CODE"
        fi

        EOF=$(uuidgen)
        echo "result<<$EOF" >> "$GITHUB_OUTPUT"
        cat /tmp/xcede_out.log >> "$GITHUB_OUTPUT"
        echo "$EOF" >> "$GITHUB_OUTPUT"

        if [ $XCEDE_EXIT_CODE -ne 0 ]; then
          echo -e "\033[31m[xcede]\033[0m xcede failed with exit code $XCEDE_EXIT_CODE"
          exit $XCEDE_EXIT_CODE
        fi
